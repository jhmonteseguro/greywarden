[www]
; FPM runs as the unprivileged "app" user (uid/gid from build args), so the
; user/group directives from the base image are ignored.
listen = 9000
; Pass the container environment (.env values) through to PHP.
clear_env = no
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
catch_workers_output = yes
decorate_workers_output = no
