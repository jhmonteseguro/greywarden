# Pages from PHP carry their own Content-Security-Policy, with a per-request nonce for Yii's
# inline scripts (src/components/Csp.php); nginx passes it on. Everything nginx serves itself
# gets this policy, which allows no inline scripts at all.
map $upstream_http_content_security_policy $gw_csp {
    ""      "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'";
    default "";
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/web;
    index index.php;
    charset utf-8;
    client_max_body_size 24m;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $gw_csp always;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Published asset bundles and theme files
    location ~* \.(?:css|js|map|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location ~ ^/assets/.*\.php$ { deny all; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 120s;
    }

    location ~ /\. { deny all; }
}
