name: ${COMPOSE_PROJECT_NAME:-greywarden}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/web:/var/www/html/web:ro

  php: &php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    image: greywarden-php:8.3
    restart: unless-stopped
    env_file: .env
    # Fixed upstream DNS for outbound lookups (intel sources, feeds, Cloudflare API).
    # Without it Docker copies the host's resolv.conf when the container starts; at
    # boot that can be before the network is up, leaving the container with no DNS.
    dns:
      - ${DNS_PRIMARY:-1.1.1.1}
      - ${DNS_SECONDARY:-9.9.9.9}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/var/www/html
      # Attachments (evidence files), outside the web root; backed up by scripts/backup.sh
      - ./storage:/var/www/storage
      - composer-cache:/home/app/.composer/cache

  # Scheduled jobs (edge pulls from Cloudflare every EDGE_PULL_INTERVAL minutes, expired
  # blocks out of Cloudflare), so no host crontab is needed: `php yii schedule/run` in the
  # same image as php, sharing its code, storage and runtime. Logs: make logs s=scheduler
  scheduler:
    <<: *php
    command: ["php", "yii", "schedule/run"]
    # The php-fpm base image stops with SIGQUIT, which makes CLI php dump core: stop with SIGTERM,
    # passed on by init so the container stops at once instead of after the 10 s timeout
    stop_signal: SIGTERM
    init: true
    depends_on:
      db:
        condition: service_healthy
      php:
        condition: service_started

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-greywarden}
      MARIADB_USER: ${DB_USER:-greywarden}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
      TZ: ${APP_TIMEZONE:-UTC}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  db-data:
  composer-cache:
